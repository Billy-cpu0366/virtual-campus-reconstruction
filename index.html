<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>虚拟校园 · 可玩雏形</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f172a'/%3E%3Cpath d='M12 42h40L32 14z' fill='%2338bdf8'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, "Cascadia Mono", monospace;
      }

      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f172a;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      #app canvas {
        image-rendering: pixelated;
        box-shadow: 0 0 0 1px rgb(148 163 184 / 32%);
      }

      [hidden] {
        display: none !important;
      }

      #entry-shell {
        position: fixed;
        inset: 0;
        z-index: 9000;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        color: #e2e8f0;
        background:
          linear-gradient(rgb(15 23 42 / 72%), rgb(15 23 42 / 88%)),
          repeating-linear-gradient(0deg, transparent 0 15px, rgb(56 189 248 / 7%) 16px);
      }

      #entry-panel {
        width: min(420px, 88vw);
        border: 2px solid #38bdf8;
        padding: 28px;
        box-sizing: border-box;
        background: rgb(15 23 42 / 94%);
        box-shadow: 8px 8px 0 rgb(2 6 23 / 65%);
        text-align: center;
      }

      #entry-panel h1 {
        margin: 0 0 20px;
        color: #7dd3fc;
        font-size: clamp(24px, 6vw, 38px);
      }

      #entry-status {
        min-height: 1.5em;
        margin: 0 0 14px;
      }

      #entry-progress {
        width: 100%;
        height: 14px;
        accent-color: #38bdf8;
      }

      #entry-progress-text {
        display: block;
        margin-top: 8px;
        color: #94a3b8;
      }

      #entry-play {
        min-width: 140px;
        border: 2px solid #e0f2fe;
        margin-top: 18px;
        padding: 10px 18px;
        color: #082f49;
        background: #7dd3fc;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      #entry-play:focus-visible,
      #content-close:focus-visible {
        outline: 3px solid #facc15;
        outline-offset: 3px;
      }

      #entry-play:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      #content-guide {
        position: fixed;
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        z-index: 7000;
        max-width: min(70vw, 520px);
        border-left: 4px solid #38bdf8;
        padding: 10px 12px;
        box-sizing: border-box;
        pointer-events: none;
        color: #e0f2fe;
        background: rgb(15 23 42 / 86%);
        font-size: clamp(12px, 2.4vw, 16px);
      }

      #content-ui-root {
        position: fixed;
        inset: 0;
        pointer-events: none !important;
        font-family: ui-monospace, "Cascadia Mono", monospace;
      }

      #content-backdrop {
        position: fixed;
        inset: 0;
        border: 0;
        padding: 0;
        background: rgb(15 23 42 / 68%);
      }

      #content-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        width: min(80vw, 896px);
        box-sizing: border-box;
        transform: translate(-50%, -50%);
        border: 4px solid #0f172a;
        border-radius: 4px;
        padding: 28px 24px 24px;
        color: #0f172a;
        background: #f8fafc;
        box-shadow: 8px 8px 0 rgb(15 23 42 / 55%);
        overscroll-behavior: contain;
      }

      #content-close {
        position: absolute;
        top: 8px;
        right: 10px;
        border: 2px solid #0f172a;
        padding: 2px 8px;
        color: #0f172a;
        background: #e2e8f0;
        font: inherit;
        cursor: pointer;
      }

      #content-title {
        margin: 0 44px 20px 0;
        font-size: clamp(22px, 5vw, 34px);
      }

      #content-body {
        margin: 0;
        white-space: pre-wrap;
        font-size: clamp(14px, 3vw, 18px);
        line-height: 1.65;
      }

      @media (max-width: 767px) {
        #entry-panel {
          padding: 22px 18px;
        }

        #content-guide {
          right: max(16px, env(safe-area-inset-right));
          bottom: auto;
          top: max(12px, env(safe-area-inset-top));
          max-width: none;
        }

        #content-modal {
          width: min(92vw, 896px);
          padding: 24px 16px 18px;
        }
      }
    </style>
  </head>
  <body data-entry-state="loading">
    <div id="app" aria-label="Campus world"></div>
    <div id="entry-shell">
      <section id="entry-panel" aria-live="polite">
        <h1>Virtual Campus</h1>
        <p id="entry-status">Loading campus assets…</p>
        <progress id="entry-progress" max="100" value="0"></progress>
        <output id="entry-progress-text" for="entry-progress">0%</output>
        <button id="entry-play" type="button" hidden disabled>Play</button>
      </section>
    </div>
    <aside id="content-guide" hidden aria-live="polite"></aside>
    <div id="content-ui-root" hidden aria-live="polite">
      <button id="content-backdrop" hidden aria-label="Close content"></button>
      <section id="content-modal" hidden role="dialog" aria-modal="true" aria-labelledby="content-title">
        <button id="content-close" type="button" aria-label="Close content">×</button>
        <h1 id="content-title"></h1>
        <p id="content-body"></p>
      </section>
    </div>
    <div id="diag" hidden style="position:fixed;top:0;left:0;right:0;max-height:40%;overflow:auto;background:#7f1d1d;color:#fff;padding:10px;font:12px/1.5 monospace;z-index:10001;white-space:pre-wrap;"></div>
    <script src="/vendor/phaser.min.js"></script>
    <script type="module" src="/game/main.ts"></script>
  </body>
</html>
