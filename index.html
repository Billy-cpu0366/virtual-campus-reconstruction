<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Campus</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f172a'/%3E%3Cpath d='M12 42h40L32 14z' fill='%2338bdf8'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, "Cascadia Mono", monospace;
      }

      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f172a;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      #app canvas {
        image-rendering: pixelated;
        box-shadow: 0 0 0 1px rgb(148 163 184 / 32%);
      }

      [hidden] {
        display: none !important;
      }

      #app-shell {
        position: fixed;
        inset: 0;
        z-index: 9000;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        color: #111827;
        background: #fff;
        line-height: 1.35;
      }

      body[data-app-state="READY"] #app-shell {
        background: rgb(255 255 255 / 10%);
      }

      #app-panel {
        width: min(560px, 100%);
        box-sizing: border-box;
        text-align: center;
      }

      .app-title {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      #app-loading,
      #app-error {
        margin: 0 auto;
        border: 4px solid #111827;
        padding: clamp(18px, 5vw, 30px);
        background: #fff;
        box-shadow: 8px 8px 0 rgb(17 24 39 / 24%);
      }

      #app-loading-image {
        display: block;
        width: min(310px, 72vw);
        height: auto;
        margin: 0 auto 18px;
        image-rendering: auto;
      }

      #app-progress-track {
        width: min(360px, 72vw);
        height: 18px;
        margin: 0 auto;
        overflow: hidden;
        border: 3px solid #111827;
        background: #fff;
      }

      #app-progress-bar {
        width: 0;
        height: 100%;
        background: #ef4444;
        transition: width 120ms linear;
      }

      #app-progress-text {
        display: block;
        margin-top: 10px;
        color: #111827;
        font-size: 18px;
        font-weight: 700;
      }

      #app-ready {
        display: grid;
        justify-items: center;
        gap: 16px;
      }

      #app-logo {
        display: block;
        width: min(441px, 82vw);
        height: auto;
        image-rendering: auto;
        filter: drop-shadow(6px 6px 0 rgb(255 255 255 / 88%));
      }

      #app-play,
      #app-retry {
        min-width: 150px;
        border: 4px solid #111827;
        margin-top: 10px;
        padding: 12px 22px;
        color: #fff;
        background: #dc2626;
        box-shadow: 5px 5px 0 #111827;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      #app-play:focus-visible,
      #app-retry:focus-visible,
      #content-close:focus-visible,
      #content-modal a:focus-visible {
        outline: 3px solid #facc15;
        outline-offset: 3px;
      }

      #app-play:disabled,
      #app-retry:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      #app-error-text {
        color: #fecaca;
      }

      #content-guide {
        position: fixed;
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        z-index: 7000;
        max-width: min(70vw, 520px);
        border-left: 4px solid #38bdf8;
        padding: 10px 12px;
        box-sizing: border-box;
        pointer-events: none;
        color: #e0f2fe;
        background: rgb(15 23 42 / 86%);
        font-size: clamp(12px, 2.4vw, 16px);
      }

      #content-ui-root {
        position: fixed;
        inset: 0;
        pointer-events: none !important;
        font-family: ui-monospace, "Cascadia Mono", monospace;
      }

      #content-backdrop {
        position: fixed;
        inset: 0;
        border: 0;
        padding: 0;
        background: rgb(15 23 42 / 68%);
      }

      #content-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        width: min(80vw, 896px);
        box-sizing: border-box;
        transform: translate(-50%, -50%);
        border: 4px solid #0f172a;
        border-radius: 4px;
        padding: 28px 24px 24px;
        color: #0f172a;
        background: #f8fafc;
        box-shadow: 8px 8px 0 rgb(15 23 42 / 55%);
        overscroll-behavior: contain;
      }

      #content-close {
        position: absolute;
        top: 8px;
        right: 10px;
        border: 2px solid #0f172a;
        padding: 2px 8px;
        color: #0f172a;
        background: #e2e8f0;
        font: inherit;
        cursor: pointer;
      }

      #content-title {
        margin: 0 44px 20px 0;
        font-size: clamp(22px, 5vw, 34px);
      }

      #content-body {
        font-size: clamp(14px, 3vw, 18px);
        line-height: 1.65;
      }

      #content-body section + section {
        margin-top: 24px;
        border-top: 1px solid #94a3b8;
        padding-top: 20px;
      }

      #content-body h3 {
        margin: 0 0 10px;
      }

      #content-body p {
        white-space: pre-wrap;
      }

      #content-body figure {
        position: relative;
        min-height: 48px;
        margin: 16px 0;
      }

      #content-body img {
        display: block;
        max-width: 100%;
        height: auto;
        image-rendering: auto;
      }

      #content-body a {
        color: #075985;
        font-weight: 700;
      }

      @media (max-width: 767px) {
        #app-loading,
        #app-error {
          padding: 18px 14px;
        }

        #app-loading-image {
          width: min(260px, 70vw);
        }

        #content-guide {
          right: max(16px, env(safe-area-inset-right));
          bottom: auto;
          top: max(12px, env(safe-area-inset-top));
          max-width: none;
        }

        #content-modal {
          width: min(92vw, 896px);
          padding: 24px 16px 18px;
        }
      }
    </style>
  </head>
  <body data-app-state="BOOT" data-app-generation="0">
    <div id="app" aria-label="Campus world"></div>
    <div id="app-shell">
      <main id="app-panel" aria-live="polite">
        <h1 class="app-title">Peter Oravec Virtual Campus</h1>
        <section id="app-loading">
          <img
            id="app-loading-image"
            width="310"
            height="310"
            src="/assets/images/peter-oravec.gif"
            alt="Peter Oravec portfolio loading animation"
          />
          <div id="app-progress-track" role="progressbar" aria-label="Campus loading progress">
            <div id="app-progress-bar"></div>
          </div>
          <output id="app-progress-text">0%</output>
        </section>
        <section id="app-ready" hidden>
          <img
            id="app-logo"
            width="441"
            height="282"
            src="/assets/images/peteroravec-logo.webp"
            alt="Peter Oravec portfolio"
          />
          <button id="app-play" type="button" hidden>Play</button>
        </section>
        <section id="app-error" hidden role="alert">
          <h2>Unable to enter campus</h2>
          <p id="app-error-text">Loading failed</p>
          <button id="app-retry" type="button" hidden>Retry</button>
        </section>
      </main>
    </div>
    <aside id="content-guide" hidden aria-live="polite"></aside>
    <div id="content-ui-root" hidden aria-live="polite">
      <button id="content-backdrop" hidden aria-label="Close content"></button>
      <section id="content-modal" hidden role="dialog" aria-modal="true" aria-labelledby="content-title">
        <button id="content-close" type="button" aria-label="Close content">×</button>
        <h1 id="content-title"></h1>
        <div id="content-body"></div>
      </section>
    </div>
    <div id="diag" hidden style="position:fixed;top:0;left:0;right:0;max-height:40%;overflow:auto;background:#7f1d1d;color:#fff;padding:10px;font:12px/1.5 monospace;z-index:10001;white-space:pre-wrap;"></div>
    <script src="/vendor/phaser.min.js"></script>
    <script type="module" src="/game/main.ts"></script>
  </body>
</html>
